<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf8f2">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141417">
<script>
(function(){
  try{
    var t = localStorage.getItem('newsforge-theme');
    if(t !== 'light' && t !== 'dark'){
      t = 'dark';
    }
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>
<title>往期归档 · {{SITE_NAME}}</title>
<meta name="description" content="{{SITE_NAME}}往期归档 - {{TAGLINE}}">
<link rel="alternate" type="application/rss+xml" title="{{SITE_NAME}} RSS" href="/feed.xml">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{SITE_NAME}}">
<meta property="og:locale" content="zh_CN">
<meta property="og:title" content="往期归档 · {{SITE_NAME}}">
<meta property="og:description" content="{{TAGLINE}}">
<meta property="og:url" content="{{SITE_URL}}/archive/">
<meta property="og:image" content="{{SITE_URL}}/logo.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="{{SITE_URL}}/archive/">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/theme.css">
<style>


*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.7}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px 60px}
/* 可信度徽标（2026-10-07）：待确认=单信源未证实；多信源=多家独立媒体交叉报道 */
.badge{display:inline-block;font-size:11px;line-height:1.5;padding:0 7px;border-radius:20px;margin-left:6px;vertical-align:2px;font-weight:600;white-space:nowrap}
.badge-pending{color:var(--muted);border:1px solid var(--border);background:var(--surface2)}
.badge-multi{color:var(--ok);border:1px solid rgba(76,196,104,.45);background:rgba(76,196,104,.06)}
.trust-badges{margin:6px 0 0}
.badge-update{color:var(--accent);border:1px solid var(--accent);background:var(--accent-soft)}
.trust-badges:empty{display:none}

header.top{padding:34px 0 10px;border-bottom:1px solid var(--border)}
header.top h1{margin:0;font-size:30px;letter-spacing:2px;display:flex;align-items:center}
header.top h1 a.brand{color:inherit;text-decoration:none;display:flex;align-items:center}
header.top h1 a.brand:hover{color:var(--accent)}
header.top h1 .logo{height:38px;width:38px;margin-right:12px;flex:none}
.site-name{font-size:24px;font-weight:800;letter-spacing:.5px;color:var(--text)}
:root{--font-display:system-ui,-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif}
header.top p{margin:6px 0 0;color:var(--muted);font-size:14px}
.crumb{padding:18px 0 6px;font-size:13px;color:var(--muted)}
.crumb a{color:var(--accent);text-decoration:none}
/* 吸顶条 + 日历（仅归档页） */
.sticky-bar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;margin:0 -18px;padding:10px 18px;background:var(--nav-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.sticky-bar .sb-home{color:var(--accent);text-decoration:none;font-size:14px;white-space:nowrap}
.sticky-bar .sb-title{font-weight:bold;font-size:15px}
.cal-btn{cursor:pointer;background:var(--surface);border:1px solid var(--border-strong);border-radius:20px;padding:6px 14px;font-size:14px;color:var(--text);margin-left:auto;user-select:none}
.cal-btn:hover{border-color:var(--accent);color:var(--accent)}
.cal-backdrop{display:none}
.cal-month + .cal-month{margin-top:14px}
.cal-label{font-size:14px;font-weight:bold;margin-bottom:8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-grid .cell{display:flex;align-items:center;justify-content:center;height:32px;border-radius:8px;font-size:13px}
.cal-grid .wd{color:var(--muted);font-size:12px;height:22px}
.cal-grid a.cell{background:var(--surface2);color:var(--text);text-decoration:none}
.cal-grid a.cell:hover{background:var(--accent);color:var(--on-accent)}
.cal-grid a.cell.latest{border:1px solid var(--accent)}
.cal-grid a.cell.selected{background:var(--accent);color:var(--on-accent)}
.cal-grid .empty{color:var(--muted2)}
.cal-grid .blank{background:none}
.ed{scroll-margin-top:70px}
/* 归档索引布局：正文 + 年份选择侧栏 */
.arch-layout{display:grid;grid-template-columns:1fr 320px;gap:22px;align-items:start}
.arch-side{position:sticky;top:64px}
.year-pick{border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:14px 16px}
.year-pick summary{cursor:pointer;list-style:none;font-weight:bold;font-size:15px}
.year-pick summary::-webkit-details-marker{display:none}
.year-block + .year-block{margin-top:16px}
.year-block h3{margin:0 0 10px;font-size:15px}
.cal-label a{color:var(--text);text-decoration:none}
.cal-label a:hover{color:var(--accent)}
.arch-side .cal-grid .cell{height:28px;font-size:12px}
@media(max-width:900px){
  .arch-layout{grid-template-columns:1fr}
  /* 移动端：侧栏日历变底部抽屉，复用同一份 DOM，不另做日历 */
  .arch-side{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:80;max-height:75vh;overflow-y:auto;background:var(--surface);border-top:1px solid var(--border);border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25);transform:translateY(105%);transition:transform .25s ease;padding:8px 16px 20px}
  html.cal-open .arch-side{transform:translateY(0)}
  html.cal-open .cal-backdrop{display:block;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:70}
}
details.month{margin:18px 0;border:1px solid var(--border);border-radius:14px;background:var(--surface);overflow:hidden}
details.month summary{cursor:pointer;padding:16px 22px;font-size:18px;font-weight:bold;list-style:none;display:flex;align-items:center;gap:10px}
details.month summary::-webkit-details-marker{display:none}
details.month summary::before{content:"▸";color:var(--accent);transition:transform .15s}
details.month[open] summary::before{transform:rotate(90deg)}
details.month summary .mcnt{font-size:13px;color:var(--muted);font-weight:normal}
details.month .ed{margin:0 22px 22px}
.ed{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px;margin:22px 0}
.ed h2{margin:0 0 6px;font-size:20px}
.ed h2 a{color:var(--text);text-decoration:none}
.ed h2 a:hover{color:var(--accent)}
.ed h2 .cnt{font-size:13px;color:var(--muted);font-weight:normal;margin-left:10px}
ul.hl{list-style:none;margin:12px 0 0;padding:0}
ul.hl li{padding:12px 0;border-top:1px solid var(--border)}
ul.hl li:first-child{border-top:none}
ul.hl .t{font-size:16px}
ul.hl .t a{color:var(--text);text-decoration:none}
ul.hl .t a:hover{color:var(--accent)}
ul.hl .sec{display:inline-block;font-size:12px;color:var(--accent);border:1px solid var(--border);border-radius:6px;padding:0 8px;margin-right:8px;white-space:nowrap}
.carried{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:1px 8px;font-size:12px;font-weight:normal;white-space:nowrap}
ul.hl .sum{margin:4px 0 0;color:var(--muted);font-size:14px}
footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--border);color:var(--muted);font-size:13px}
footer .build{margin-top:8px;font-size:12px;color:var(--muted2)}
a{color:var(--accent)}

.head-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.theme-toggle{background:var(--surface);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);flex-shrink:0;padding:0}
.theme-toggle:hover{border-color:var(--accent);color:var(--accent)}
.theme-toggle svg{width:19px;height:19px}
.theme-toggle .icon-moon{display:none}
:root[data-theme="light"] .theme-toggle .icon-sun{display:block}
:root[data-theme="light"] .theme-toggle .icon-moon{display:none}

</style>
</head>
<body>
<div class="wrap">
  <header class="top" data-pagefind-ignore>
    <div class="head-row">
      <h1><a class="brand" href="/"><img class="logo" src="/logo.png" alt="" onerror="this.style.display='none'"><span class="site-name">{{SITE_NAME}}</span></a></h1>
      <button id="theme-toggle" class="theme-toggle" aria-label="切换主题" title="浅色 / 深色">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 14.2A8 8 0 1 1 9.8 4.5a6.6 6.6 0 0 0 9.7 9.7z" stroke-width="2"/><path d="M17.8 3.5v3.2M16.2 5.1h3.2" stroke-width="1.6"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><circle cx="12" cy="12" r="8.5" stroke-width="2"/><circle cx="12" cy="12" r="2.6" stroke-width="2"/><path d="M12 3.5v5.9M12 14.6v5.9M3.5 12h5.9M14.6 12h5.9" stroke-width="2"/></svg>
      </button>
    </div>
    <p>{{TAGLINE}}</p>
  </header>
  <div class="sticky-bar">
    <a class="sb-home" href="/">← 首页</a><span class="sb-title">往期归档</span>
    <button type="button" class="cal-btn" id="cal-btn">📅 日历</button>
  </div>
  <div class="cal-backdrop" id="cal-backdrop"></div>
  <nav class="crumb"><a href="/">首页</a> <span>/</span> <span>往期归档</span></nav>
  <main data-pagefind-body>
    <span data-pagefind-meta="title" style="display:none">往期归档 · {{SITE_NAME}}</span>
    <div class="arch-layout">
      <div class="arch-main">{{ARCHIVE_LIST}}</div>
      <aside class="arch-side">
        <details class="year-pick" id="year-pick" open>
          <summary>🗓 选择月份</summary>
          {{YEAR_CALENDAR}}
        </details>
      </aside>
    </div>
  </main>
  <footer data-pagefind-ignore>
    <strong>免责声明：</strong>{{DISCLAIMER}}
    <div class="build">构建于 {{BUILD_TIME}} · <a href="/about/">关于我们</a> · <a href="/feed.xml">RSS 订阅</a></div>
  </footer>
</div>
<script>
(function(){
  var root = document.documentElement;
  var btn = document.getElementById('theme-toggle');
  function applyLabel(t){ if(btn) btn.setAttribute('aria-label', t === 'dark' ? '切换到浅色主题' : '切换到深色主题'); }
  var init = root.getAttribute('data-theme') || 'light';
  applyLabel(init);
  if(btn){
    btn.addEventListener('click', function(){
      var cur = root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      var next = cur === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try{ localStorage.setItem('newsforge-theme', next); }catch(e){}
      applyLabel(next);
    });
  }
  try{
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onChange = function(e){
      try{
        if(!localStorage.getItem('newsforge-theme')){
          var t = e.matches ? 'dark' : 'light';
          root.setAttribute('data-theme', t);
          applyLabel(t);
        }
      }catch(err){}
    };
    if(mq.addEventListener) mq.addEventListener('change', onChange);
    else if(mq.addListener) mq.addListener(onChange);
  }catch(e){}
  // 📅 日历按钮：桌面端滚动到侧栏日历；移动端打开底部抽屉（复用同一份侧栏 DOM）
  try{
    var calBtn = document.getElementById('cal-btn');
    var side = document.querySelector('.arch-side');
    var backdrop = document.getElementById('cal-backdrop');
    var rootEl = document.documentElement;
    function closeCal(){
      rootEl.classList.remove('cal-open');
      rootEl.style.overflow = '';
    }
    function openCal(){
      var yp = document.getElementById('year-pick');
      if(yp) yp.setAttribute('open', '');
      if(window.matchMedia('(max-width: 900px)').matches){
        rootEl.classList.add('cal-open');
        rootEl.style.overflow = 'hidden';
      }else if(side){
        try{ side.scrollIntoView({behavior:'smooth', block:'start'}); }
        catch(e){ side.scrollIntoView(); }
      }
    }
    if(calBtn){
      calBtn.addEventListener('click', function(){
        if(rootEl.classList.contains('cal-open')) closeCal(); else openCal();
      });
    }
    if(backdrop) backdrop.addEventListener('click', closeCal);
    document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeCal(); });
    // 点侧栏日期后关闭抽屉（移动端）；桌面端无抽屉，closeCal 是空操作
    if(side){
      side.addEventListener('click', function(e){
        var a = e.target.closest ? e.target.closest('a') : null;
        if(a) closeCal();
      });
    }
  }catch(e){}
  // 日历选中高亮：按 URL 锚点（#d-YYYY-MM-DD）标出当前选中的日期；latest 的边框是“最新”标记，两者可共存
  try{
    function syncCalSelected(){
      var m = (location.hash || '').match(/^#d-(\d{4}-\d{2}-\d{2})$/);
      var prev = document.querySelectorAll('.cal-grid a.cell.selected');
      for(var i = 0; i < prev.length; i++) prev[i].classList.remove('selected');
      if(!m) return;
      var cur = document.querySelectorAll('.cal-grid a.cell[href$="#d-' + m[1] + '"]');
      for(var j = 0; j < cur.length; j++) cur[j].classList.add('selected');
    }
    syncCalSelected();
    window.addEventListener('hashchange', syncCalSelected);
  }catch(e){}
})();
</script>
</body>
</html>
